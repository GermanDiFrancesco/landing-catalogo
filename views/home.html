<!-- 1. HERO CAROUSEL -->
<section class="w-full relative overflow-hidden bg-gray-100 group" id="hero-carousel">
  <div class="flex transition-transform duration-500 ease-in-out" id="carousel-track">
    <div class="min-w-full">
      <img src="/assets/img/banners/carrusel 1.png" alt="Banner Tecnografic 1" class="w-full h-auto max-h-[500px] object-cover">
    </div>
    <div class="min-w-full">
      <img src="/assets/img/banners/carrusel 2.png" alt="Banner Tecnografic 2" loading="lazy" decoding="async" class="w-full h-auto max-h-[500px] object-cover">
    </div>
    <div class="min-w-full">
      <img src="/assets/img/banners/carrusel 3.png" alt="Banner Tecnografic 3" loading="lazy" decoding="async" class="w-full h-auto max-h-[500px] object-cover">
    </div>
    <div class="min-w-full">
      <img src="/assets/img/banners/carrusel 4.png" alt="Banner Tecnografic 4" loading="lazy" decoding="async" class="w-full h-auto max-h-[500px] object-cover">
    </div>
  </div>

  <!-- Botones de Control Anterior / Siguiente -->
  <button type="button" id="carousel-prev" class="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/80 hover:bg-white text-gray-800 shadow-lg flex items-center justify-center transition-all opacity-85 group-hover:opacity-100" aria-label="Anterior">
    <i class="fa-solid fa-chevron-left text-xl"></i>
  </button>
  <button type="button" id="carousel-next" class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/80 hover:bg-white text-gray-800 shadow-lg flex items-center justify-center transition-all opacity-85 group-hover:opacity-100" aria-label="Siguiente">
    <i class="fa-solid fa-chevron-right text-xl"></i>
  </button>

  <!-- Indicadores de slide -->
  <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2">
    <button type="button" class="w-3 h-3 rounded-full bg-white transition-all carousel-dot" data-index="0" aria-label="Slide 1"></button>
    <button type="button" class="w-3 h-3 rounded-full bg-white/50 transition-all carousel-dot" data-index="1" aria-label="Slide 2"></button>
    <button type="button" class="w-3 h-3 rounded-full bg-white/50 transition-all carousel-dot" data-index="2" aria-label="Slide 3"></button>
    <button type="button" class="w-3 h-3 rounded-full bg-white/50 transition-all carousel-dot" data-index="3" aria-label="Slide 4"></button>
  </div>
</section>
