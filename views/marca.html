<!-- 1. HERO ACTION DE MARCA (Mantiene su estilo original, alineado con el sidebar) -->
<section class="w-full text-white py-8 md:py-12 shadow-inner relative overflow-hidden" id="brand-hero-section">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col lg:flex-row items-center gap-8 lg:gap-10">
      
      <!-- Logo a la izquierda (Alineado exactamente al ancho del sidebar: lg:w-72 xl:w-80) -->
      <div class="w-full lg:w-72 xl:w-80 flex-shrink-0 flex justify-center lg:justify-start">
        <div class="max-h-full max-w-full object-contain flex items-center justify-center">
          <img id="brand-hero-logo" src="" alt="Marca" class="max-h-full max-w-full object-contain">
        </div>
      </div>

      <!-- Slogan y texto descriptivo a la derecha (Ocupa el resto del espacio igual que el main content: flex-1) -->
      <div class="flex-1 w-full text-center lg:text-left">
        <h2 id="brand-hero-slogan" class="text-2xl sm:text-3xl lg:text-4xl font-extrabold tracking-tight mb-3 uppercase italic drop-shadow-sm font-montserrat">
          <!-- Slogan inyectado por JS -->
        </h2>
        <p id="brand-hero-desc" class="text-sm sm:text-base text-white/95 leading-relaxed max-w-2xl">
          <!-- Descripción inyectada por JS -->
        </p>
      </div>

    </div>
  </div>
</section>

<!-- 2. LAYOUT DE CATÁLOGO (SIDEBAR + MAIN CONTENT DE MARCA) -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
  <div class="flex flex-col lg:flex-row items-start gap-8 lg:gap-10">
    
    <!-- SIDEBAR DE CATEGORÍAS -->
    <aside class="w-full lg:w-72 xl:w-80 flex-shrink-0 text-white rounded-b-3xl py-6 sm:py-8 shadow-md transition-colors" id="brand-sidebar-container">
      <ul class="space-y-3" id="brand-categories-list">
        <!-- Categorías inyectadas dinámicamente -->
      </ul>
    </aside>

    <!-- MAIN CONTENT DE MARCA (Vista desacoplada para grilla y detalle) -->
    <div class="flex-1 w-full bg-white px-3 sm:px-4 lg:p-6" id="brand-main-content">
      
      <!-- SUB-VISTA 1: GRILLA DE PRODUCTOS DE LA FAMILIA/CATEGORÍA -->
      <div id="brand-category-grid-view">
        <!-- Grilla de Cards de Productos -->
        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6" id="brand-products-grid">
          <!-- Cards generados dinámicamente -->
        </div>
      </div>

      <!-- SUB-VISTA 2: DETALLE DEL PRODUCTO Y VARIANTES (INICIALMENTE OCULTO) -->
      <div id="brand-product-detail-view" class="hidden">
        
        <!-- Botón de regreso a la grilla y migas de pan -->
        <div class="flex items-center justify-between mb-2">
          <button 
            type="button" 
            id="btn-back-to-grid"
            class="inline-flex items-center gap-2 text-xs sm:text-sm font-bold text-gray-600 hover:text-blue-600 bg-gray-50 hover:bg-gray-100 px-4 py-2 rounded-xl transition-all border border-gray-200"
          >
            <i class="fa-solid fa-arrow-left"></i>
            <span id="btn-back-to-grid-text">Volver al listado de la categoría</span>
          </button>

          <!-- Navegación rápida entre productos vecinos -->
          <div class="flex items-center gap-2">
            <button type="button" id="btn-prev-product" class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-100" title="Producto anterior">
              <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <span id="product-pagination-indicator" class="text-xs text-gray-500 font-medium">1 / 1</span>
            <button type="button" id="btn-next-product" class="w-8 h-8 rounded-lg border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-100" title="Producto siguiente">
              <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
          </div>
        </div>

        <!-- Card de Producto Individual y Variantes Dinámicas -->
        <div class="bg-gray-50/70 p-4 sm:p-6" id="product-detail-card">
          
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start mb-8">
            
            <!-- Columna izquierda: Imagen Principal + Galería -->
            <div class="lg:col-span-5 flex flex-col items-center">
              <div class="w-full bg-white rounded-2xl border border-gray-200/70 p-6 flex items-center justify-center min-h-[260px] sm:min-h-[300px] shadow-sm relative group overflow-hidden">
                <img 
                  id="product-main-image" 
                  src="" 
                  alt="Foto de producto" 
                  class="max-h-56 sm:max-h-64 max-w-full object-contain transition-all duration-300 transform group-hover:scale-105"
                >
                <span id="product-variant-badge" class="absolute top-3 left-3 text-[10px] uppercase font-bold tracking-wider px-2 py-1 rounded-md bg-gray-100 text-gray-600">
                  Vista Familia
                </span>
              </div>

            </div>

            <!-- Columna derecha: Título, Atributos y Variantes -->
            <div class="lg:col-span-7 flex flex-col justify-between space-y-5">
              <div>
                <h3 class="text-2xl sm:text-3xl font-extrabold text-gray-900 leading-tight mb-2" id="sample-product-title">
                  <!-- Nombre del Producto -->
                </h3>
                <p class="text-sm text-gray-600 leading-relaxed" id="product-description-text">
                  <!-- Descripción del producto -->
                </p>
              </div>

              <!-- SELECTORES DE VARIANTES INTERACTIVAS -->
              <div class="space-y-4 pt-4 border-t border-gray-200/80" id="variant-selectors-container">
                
                <!-- 1. Tamaño -->
                <div id="selector-tamano-wrapper">
                  <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">
                    Tamaño
                  </label>
                  <div class="flex flex-wrap gap-2" id="options-tamano">
                    <!-- Botones de tamaño -->
                  </div>
                </div>

                <!-- 2. Cantidad de Hojas -->
                <div id="selector-hojas-wrapper">
                  <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">
                    Cantidad de Hojas
                  </label>
                  <div class="flex flex-wrap gap-2" id="options-hojas">
                    <!-- Botones de hojas -->
                  </div>
                </div>

                <!-- 3. Tipo de Hoja / Rayado -->
                <div id="selector-tipo-hoja-wrapper">
                  <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">
                    Tipo de Hoja
                  </label>
                  <div class="flex flex-wrap gap-2" id="options-tipo-hoja">
                    <!-- Botones de tipo de hoja -->
                  </div>
                </div>

                <!-- 4. Manos (para Libros Comerciales) -->
                <div id="selector-manos-wrapper" class="hidden">
                  <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">
                    Cantidad de Manos
                  </label>
                  <div class="flex flex-wrap gap-2" id="options-manos">
                    <!-- Botones de manos -->
                  </div>
                </div>

                <!-- 5. Colores Disponibles -->
                <div id="selector-colores-wrapper">
                  <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-2">
                    Color: <span id="selected-color-name" class="font-normal text-gray-500"></span>
                  </label>
                  <div class="flex flex-wrap items-center gap-3" id="sample-product-colors">
                    <!-- Muestras de color circulares -->
                  </div>
                </div>

              </div>

            </div>

          </div>

          <!-- Ficha Técnica (Tabla de especificaciones dinámica) -->
          <div class="mt-4 overflow-hidden rounded-xl border border-gray-200 text-center shadow-sm">
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 text-white text-[11px] sm:text-xs font-bold py-2.5 px-2 gap-1" id="specs-header">
              <div>TAMAÑO</div>
              <div>TIPO</div>
              <div>COLOR</div>
              <div>CAJA</div>
              <div>PAQUETE</div>
              <div>PALET</div>
              <div>GRAMAJE</div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 bg-white text-gray-800 text-xs sm:text-sm font-semibold py-3 px-2 items-center divide-y sm:divide-y-0 sm:divide-x divide-gray-100 gap-y-2 sm:gap-y-0">
              <div class="py-1">
                <span class="block text-[10px] sm:hidden text-gray-400 font-bold uppercase">Tamaño</span>
                <span id="spec-tamano" class="font-extrabold text-gray-900">—</span>
              </div>
              <div class="py-1">
                <span class="block text-[10px] sm:hidden text-gray-400 font-bold uppercase">Tipo</span>
                <span id="spec-tipo" class="text-gray-700">—</span>
              </div>
              <div class="py-1">
                <span class="block text-[10px] sm:hidden text-gray-400 font-bold uppercase">Color</span>
                <span id="spec-color" class="text-gray-700">—</span>
              </div>
              <div class="py-1">
                <span class="block text-[10px] sm:hidden text-gray-400 font-bold uppercase">Caja</span>
                <span id="spec-caja" class="text-gray-700">—</span>
              </div>
              <div class="py-1">
                <span class="block text-[10px] sm:hidden text-gray-400 font-bold uppercase">Paquete</span>
                <span id="spec-paquete" class="text-gray-700">—</span>
              </div>
              <div class="py-1">
                <span class="block text-[10px] sm:hidden text-gray-400 font-bold uppercase">Palet</span>
                <span id="spec-palet" class="text-gray-700">—</span>
              </div>
              <div class="py-1">
                <span class="block text-[10px] sm:hidden text-gray-400 font-bold uppercase">Gramaje</span>
                <span id="spec-gramaje" class="text-gray-700">—</span>
              </div>
            </div>
          </div>

        </div>

      </div>

    </div>

  </div>
</section>
